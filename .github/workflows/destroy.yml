name: Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy
    if: |
      github.repository == 'mohamed-ahmed-58059/hf-ml-platform.rate-limiter' &&
      github.actor == 'mohamed-ahmed-58059'
    environment: production
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Empty ECR repository
        run: |
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name hf-ml-platform/rate-limiter \
            --query 'imageIds[*]' \
            --output json 2>/dev/null || echo "[]")
          if [ "$IMAGE_IDS" != "[]" ] && [ -n "$IMAGE_IDS" ]; then
            aws ecr batch-delete-image \
              --repository-name hf-ml-platform/rate-limiter \
              --image-ids "$IMAGE_IDS"
          fi

      - name: Delete ECR stack
        run: |
          aws cloudformation delete-stack \
            --stack-name hf-ml-platform-rate-limiter-ecr \
            --region us-east-1
          aws cloudformation wait stack-delete-complete \
            --stack-name hf-ml-platform-rate-limiter-ecr \
            --region us-east-1
